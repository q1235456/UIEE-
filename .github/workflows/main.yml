name: ARM64编译

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile-linux:
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 安装ARM64交叉编译器
      run: |
        sudo apt update
        sudo apt install -y g++-aarch64-linux-gnu build-essential
        
    - name: 显示编译器版本
      run: |
        aarch64-linux-gnu-g++ --version
        
    - name: 创建构建目录
      run: |
        mkdir -p build
        
    - name: 编译main.cpp
      run: |
        aarch64-linux-gnu-g++ -std=c++17 -O2 -Wall -Wextra -D_GNU_SOURCE -D_LINUX -I./include -c ./bin/main.cpp -o build/main.o
        
    - name: 编译uiee_engine.cpp
      run: |
        aarch64-linux-gnu-g++ -std=c++17 -O2 -Wall -Wextra -D_GNU_SOURCE -D_LINUX -I./include -c ./bin/uiee_engine.cpp -o build/uiee_engine.o
        
    - name: 链接可执行文件
      run: |
        aarch64-linux-gnu-g++ build/main.o build/uiee_engine.o -o bin/uiee_engine_arm64 -lpthread -static-libstdc++
        
    - name: 剥离调试信息
      run: |
        aarch64-linux-gnu-strip bin/uiee_engine_arm64
        
    - name: 设置执行权限
      run: |
        chmod 755 bin/uiee_engine_arm64
        
    - name: 验证架构
      run: |
        file bin/uiee_engine_arm64
        
    - name: 上传产物
      uses: actions/upload-artifact@v4
      with:
        name: uiee_engine_arm64
        path: bin/uiee_engine_arm64
